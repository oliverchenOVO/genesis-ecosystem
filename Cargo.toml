[workspace]
members = ["crates/sim-core", "crates/sim-benchmark", "crates/sim-app", "crates/sim-server", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
blake3 = "1.8"
flate2 = "1.1"

[profile.release]
lto = "thin"
