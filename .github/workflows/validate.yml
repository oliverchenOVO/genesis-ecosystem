name: GENESIS versioned validation
on: [push, pull_request, workflow_dispatch]
jobs:
  legacy-v4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.1.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
      - run: cargo test --release --locked -p sim-core --test golden
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p sim-core -p sim-app -p sim-benchmark -p sim-server --all-targets --all-features --locked -- -D warnings
      - run: cargo test --release --locked -p sim-core -p sim-app -p sim-benchmark -p sim-server
      - run: cargo test --release --locked -p sim-core --features profile
      - run: cargo test --release --locked -p sim-core --features viability
      - run: cargo test --release --locked -p sim-benchmark --features viability
      - run: cargo run --release -p sim-benchmark --locked -- --stress --seeds 10 --ticks 2000 --population 50 --limit 200
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
          components: rustfmt, clippy
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/phase2-summary-checks.mjs scripts/ecological-diagnostics-checks.mjs scripts/ecology-candidate-checks.mjs scripts/temporal-ecology-checks.mjs
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --release --workspace --locked
      - run: pnpm tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: genesis-windows
          path: target/release/bundle/nsis/*.exe
